<div class="page-wrapper">
    {% if data.background_image %}
    <div class="background-image" data-blur="10"></div>
    {% endif %}
    {% set style %}{% include './style.json' %}{% endset %}
    <div id="{{ data.chart_id }}" class="chart-container">{{ chart_svg(data.build_option(), style, width=961) }}</div>
</div>

<style>
    {% if data.background_image %}
    .background-image {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("{{ asset('ui/background/' + data.background_image) }}");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        z-index: 0;
        transform: scale(1.08);
        border-radius: 12px;
    }
    {% endif %}
</style>
