{% if not frameless %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ data.title }}{% endblock %}</title>

    <style>
        {% include 'theme.css.jinja' %}
    </style>

    <style>
        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #fff;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
{% endif %}

{% block body_content %}{% endblock %}

{% if not frameless %}
</body>
</html>
{% endif %}
